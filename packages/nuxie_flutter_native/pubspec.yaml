name: nuxie_flutter_native
description: Native iOS/Android implementation for nuxie_flutter.
version: 1.0.0
repository: https://github.com/nuxieai/nuxie-flutter/tree/main/packages/nuxie_flutter_native

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  nuxie_flutter_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 26.3.4

flutter:
  plugin:
    platforms:
      android:
        package: io.nuxie.flutter.nativeplugin
        pluginClass: NuxieFlutterNativePlugin
      ios:
        pluginClass: NuxieFlutterNativePlugin
